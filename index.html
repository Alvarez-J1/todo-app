<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple todo app for creating, tracking, completing, and deleting tasks."
    />
    <title>Simple ToDo App</title>
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">
      <div class="page__content">
        <header class="header">
          <h1 class="header__title">The Simple ToDo App</h1>
          <p class="header__banner">Do these things</p>
          <button
            aria-controls="add-todo-popup"
            aria-expanded="false"
            aria-haspopup="dialog"
            class="button button_action_add header__button"
            type="button"
          >
            + Add Todo
          </button>
          <div
            aria-hidden="true"
            aria-labelledby="add-todo-title"
            aria-modal="true"
            class="popup"
            id="add-todo-popup"
            role="dialog"
          >
            <div class="popup__content">
              <h2 class="popup__title" id="add-todo-title">Add new ToDo</h2>
              <button
                aria-label="Close add todo dialog"
                class="popup__close"
                type="button"
              ></button>
              <form
                aria-labelledby="add-todo-title"
                class="popup__form"
                name="add-todo-form"
                id="add-todo-form"
                novalidate
              >
                <fieldset class="popup__fieldset">
                  <legend class="visually-hidden">Todo details</legend>
                  <label class="popup__label" for="todo-name">
                    What needs to be done?
                    <input
                      aria-describedby="todo-name-error"
                      class="popup__input"
                      autocomplete="off"
                      id="todo-name"
                      maxlength="40"
                      minlength="2"
                      name="name"
                      placeholder="Write here"
                      required
                      type="text"
                    />
                    <span
                      aria-atomic="true"
                      aria-live="polite"
                      class="popup__error"
                      id="todo-name-error"
                    ></span>
                  </label>
                  <label class="popup__label" for="todo-date">
                    When does it need to be done? (optional)
                    <input
                      aria-describedby="todo-date-error"
                      class="popup__input popup__input_type_date"
                      id="todo-date"
                      name="date"
                      type="date"
                      min="2023-01-01"
                      max="3000-12-31"
                    />
                    <span
                      aria-atomic="true"
                      aria-live="polite"
                      class="popup__error"
                      id="todo-date-error"
                    ></span>
                  </label>
                </fieldset>
                <button class="button popup__button" type="submit">
                  Create
                </button>
              </form>
            </div>
          </div>
        </header>
        <main>
          <section aria-labelledby="counter-heading" class="counter">
            <h2
              aria-atomic="true"
              aria-live="polite"
              class="counter__text"
              id="counter-heading"
            >
              Showing X out of Y completed
            </h2>
          </section>
          <section aria-labelledby="todos-heading" class="todos">
            <h2 class="visually-hidden" id="todos-heading">Todo list</h2>
            <ul class="todos__list">
              <template id="todo-template">
                <li class="todo">
                  <label class="todo__label">
                    <input
                      aria-label="Todo completed"
                      class="todo__completed"
                      type="checkbox"
                    />
                    <span class="todo__name"></span>
                    <time class="todo__date"></time>
                  </label>
                  <ul aria-label="Todo actions" class="todo__buttons">
                    <li>
                      <button
                        aria-label="Delete todo"
                        class="todo__delete-btn"
                        type="button"
                      ></button>
                    </li>
                  </ul>
                </li>
              </template>
            </ul>
          </section>
          <script type="module" src="./pages/index.js"></script>
        </main>
      </div>
    </div>
  </body>
</html>
